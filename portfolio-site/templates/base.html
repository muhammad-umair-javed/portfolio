<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.description() }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%230a6c8f'/><text x='16' y='23' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='600'>UJ</text></svg>">
<link rel="preload" href="{{ root }}assets/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ root }}assets/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="wrap site-header">
  {% if active == 'home' %}<span></span>{% else %}<a class="brand" href="{{ root }}index.html">{{ site.name }}</a>{% endif %}
  <nav aria-label="Main">
    <a href="{{ root }}projects.html"{% if active == 'projects' %} aria-current="page"{% endif %}>Projects</a>
    <a href="{{ root }}experience.html"{% if active == 'experience' %} aria-current="page"{% endif %}>Experience</a>
    <a href="{{ root }}about.html"{% if active == 'about' %} aria-current="page"{% endif %}>About</a>
    {% if has_cv %}<a href="{{ root }}cv.pdf">CV</a>{% endif %}
  </nav>
</header>
<main id="main" class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap site-footer">
  <span>Updated {{ updated }}</span>
  <span>Content on this site is my own work unless stated. Lab code and CAD are not published.</span>
</footer>
<script src="{{ root }}assets/site.js" defer></script>
</body>
</html>
